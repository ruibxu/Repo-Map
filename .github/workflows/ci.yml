name: RepoMap CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Download the pinned embedding model and run its integration test
        type: boolean
        default: false

# PR checks need no write access or application credentials.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPOMAP_TEST_LOCAL_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.real_model && '1' || '0' }}
      REPOMAP_CPU_THREADS: '4'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check dependency consistency
        run: python -m pip check
      # Default checks use deterministic encoders; a manual run can enable
      # the real-model test without requiring provider credentials.
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and build frontend
        run: npm run build
