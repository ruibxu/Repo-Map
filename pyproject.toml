[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repomap"
version = "0.1.0"
description = "Local repository intelligence and retrieval research engine"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.8", "uvicorn==0.34.0",
  "tree-sitter==0.25.2", "tree-sitter-python==0.25.0",
  "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2",
  "chromadb==1.0.20", "sentence-transformers==3.4.1", "psutil==7.0.0",
  "httpx==0.28.1",
]

[project.scripts]
repomap = "repomap.cli:main"

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
